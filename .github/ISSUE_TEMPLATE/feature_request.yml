name: Feature request
description: A stat or view you'd like to see.
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: The question it would answer for you.
